name: Backend

on:
  push:
    branches: [master]
    paths:
      - "backend/**"
      - ".github/workflows/backend.yml"
      - "Dockerfile"
      - ".dockerignore"
      - "docker-compose.yml"
      - ".env.compose.example"
  pull_request:
    branches: [master]
    paths:
      - "backend/**"
      - ".github/workflows/backend.yml"
      - "Dockerfile"
      - ".dockerignore"
      - "docker-compose.yml"
      - ".env.compose.example"

permissions:
  contents: read

jobs:
  core:
    name: Core / Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - run: python -m pip install -e "backend[dev]"
      - run: python -m pytest backend/tests -p no:cacheprovider

  app:
    name: App / PostgreSQL
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: projectlens_ci
          POSTGRES_PASSWORD: ci_only_password
          POSTGRES_DB: projectlens_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U projectlens_ci -d projectlens_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      TEST_DATABASE_URL: postgresql+psycopg://projectlens_ci:ci_only_password@localhost:5432/projectlens_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - run: python -m pip install -e "backend[dev,app]"
      - run: python -m pytest backend/tests -p no:cacheprovider

  docker-build:
    name: Docker image build (unverified locally)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          push: false
